version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:///janus_dev.db
      - SECRET_KEY=dev-secret-key-change-in-production
    volumes:
      - .:/app
    command: python Janus.py

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=janus
      - POSTGRES_PASSWORD=januspassword
      - POSTGRES_DB=janus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
